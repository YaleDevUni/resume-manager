version: '3.8'

services:
  mongodb:
    image: mongodb/mongodb-community-server:7.0.3-ubuntu2204
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - app_network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "5001:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/project-resume
    depends_on:
      - mongodb
    networks:
      - app_network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  mongodb_data:
